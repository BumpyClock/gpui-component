name: "Release Gate"
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read

jobs:
  release_gate:
    name: Validate registry release prerequisites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Show required publication order
        run: cargo xtask publish-plan --require-registry
      - name: Validate source, tests, and package artifacts
        run: cargo xtask release-check --require-registry
