[package]
name = "gpui-component-app"
description = "Application shell for gpui-component apps: AppShell builder, lifecycle events, identity, settings, windows, theme, menus."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-manifest.workspace = true
gpui-component-storage.workspace = true
log.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true

# GPUI must construct its `App` on the main thread, which cargo's default test
# harness (worker threads) cannot provide. This test drives the shell from its
# own `main`, on the process main thread.
[[test]]
name = "headless"
harness = false

[lints]
workspace = true
